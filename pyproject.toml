[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "carbonexus"
version = "0.1.0"
description = "CarbonNexus MVP: CEI, hotspot detection, forecasting and explainability from public satellite/reanalysis data"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "scikit-learn>=1.3",
  "xarray>=2024.1", "netCDF4>=1.6", "requests>=2.31",
  "fastapi>=0.110", "uvicorn>=0.27",
]

[project.optional-dependencies]
gee = ["earthengine-api>=0.1.390"]
torch = ["torch>=2.1"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
carbonexus = "carbonexus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
carbonexus = ["web/*", "web/vendor/*", "web/vendor/images/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
